name: Heisuca WinGet Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'distribution/winget/**'
      - '.github/workflows/heisuca-winget.yml'
  pull_request:
    paths:
      - 'distribution/winget/**'
      - '.github/workflows/heisuca-winget.yml'

permissions:
  contents: read

jobs:
  validate-winget:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python YAML and JSON Schema dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Validate WinGet YAML manifests and official 1.12.0 schemas
        run: python distribution/winget/validate.py distribution/winget/manifests/h/Heisuca/Heisuca/2.0.45.2

      - name: Verify installer in Windows VM
        shell: pwsh
        run: ./distribution/winget/verify-vm.ps1 -ManifestDir distribution/winget/manifests/h/Heisuca/Heisuca/2.0.45.2 -OutDir "${{ runner.temp }}/heisuca-winget"

      - name: Upload receipt and log only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heisuca-winget-receipt
          path: ${{ runner.temp }}/heisuca-winget/
          if-no-files-found: warn
