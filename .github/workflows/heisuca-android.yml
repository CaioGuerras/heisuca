name: Heisuca Android Build

on:
  push:
    branches: ["gemini/**", "claude/**", "codex/heisuca-**"]
    paths-ignore: ["docs/**", "AGENTS.md", "apps/app/CLAUDE.md"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.1"
  # MobSF fixo (última v4.x estável no Docker Hub em 28/10/2026).
  MOBSF_TAG: "v4.5.3"
  # relatorio: classifica e resume sem falhar; bloquear: vermelho falha o job.
  MOBSF_MODO: relatorio

concurrency:
  group: heisuca-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar APK Heisuca (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Liberar espaco em disco na VM
        working-directory: /
        run: |
          echo "Espaco antes da limpeza:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "Espaco apos a limpeza:"
          df -h /

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: heisuca-clean-${{ runner.os }}-gradle-${{ hashFiles('apps/app/**/*.gradle*', 'apps/app/**/gradle-wrapper.properties') }}

      - name: Obter dependências Flutter
        run: flutter pub get --no-example

      - name: Preparar leitura dos pixels nativos no portão
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi

      - name: Validar análise e testes antes do APK
        run: bash scripts/heisuca-checar.sh

      - name: Configurar Assinatura
        env:
          KEYSTORE_B64: ${{ secrets.HEISUCA_PLAY_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.HEISUCA_PLAY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.HEISUCA_PLAY_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HEISUCA_PLAY_KEY_ALIAS }}
        run: |
          # Sem a chave do Heisuca o APK não é gerado: nunca cair para a chave de debug.
          missing=()
          [ -n "$KEYSTORE_B64" ] || missing+=(HEISUCA_PLAY_KEYSTORE_B64)
          [ -n "$STORE_PASSWORD" ] || missing+=(HEISUCA_PLAY_STORE_PASSWORD)
          [ -n "$KEY_PASSWORD" ] || missing+=(HEISUCA_PLAY_KEY_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(HEISUCA_PLAY_KEY_ALIAS)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Faltam secrets de assinatura: ${missing[*]}"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.p12
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.p12"
          } > android/key.properties
          echo "Assinando com a chave do Heisuca."

      - name: Conferir isolamento dos providers no manifesto
        run: python3 scripts/heisuca-validar-apk.py --source-only

      - name: Testar limites nativos do buffer mpv
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest --tests app.heisuca.mpv.HeisucaBufferBudgetTest --tests app.heisuca.HeisucaPipParamsTest --tests app.heisuca.HeisucaDownloadNotificationTest --tests app.heisuca.mpv.MpvPlayerBackgroundAudioTest -PtargetAbi=arm64-v8a -PheisucaPreview=true

      - name: Compilar APK Release (arm64-v8a)
        run: |
          preview_args=()
          if [[ "$GITHUB_REF_NAME" == codex/heisuca-* || "$GITHUB_REF_NAME" == claude/heisuca-* ]]; then
            preview_args+=(-PheisucaPreview=true)
          fi
          flutter build apk --release --target-platform android-arm64 --split-per-abi -PtargetAbi=arm64-v8a "${preview_args[@]}" --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Conferir pacote, providers e assinatura do APK
        run: python3 scripts/heisuca-validar-apk.py build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Organizar e Renomear APKs
        run: |
          mkdir -p dist
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "dist/heisuca-arm64-v8a.apk"
          elif [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-release.apk" "dist/heisuca-arm64-v8a.apk"
          else
            cp build/app/outputs/flutter-apk/*.apk dist/heisuca-arm64-v8a.apk
          fi
          ls -lh dist

      - name: Guardar APK para diagnóstico se uma conferência falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: heisuca-diagnostico-nao-aprovado
          path: apps/app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore
          retention-days: 3

      - name: Publicar Artifact Heisuca APK
        uses: actions/upload-artifact@v4
        with:
          name: heisuca-apk
          path: |
            apps/app/dist/*.apk
            apps/app/assets/heisuca/CHANGELOG_USUARIO.md
          retention-days: 14


  mobsf:
    name: Análise estática do APK (MobSF)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Modo relatório (MOBSF_MODO=relatorio): falha de API/infra do MobSF não derruba o build do APK.
    # Trocar para false junto com MOBSF_MODO=bloquear, depois da triagem dos achados.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Baixar o APK do build
        uses: actions/download-artifact@v4
        with:
          name: heisuca-apk
          path: ${{ runner.temp }}/apk

      - name: Conferir que a tag fixa do MobSF existe no Docker Hub
        run: |
          code="$(curl -s -o "$RUNNER_TEMP/tag.json" -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/opensecurity/mobile-security-framework-mobsf/tags/${MOBSF_TAG}")"
          test "$code" = "200" || { echo "::error::tag ${MOBSF_TAG} não existe no Docker Hub (http $code)"; exit 1; }
          echo "Tag ${MOBSF_TAG} confirmada."
          echo "Tags v4.x mais recentes (para decidir a próxima atualização):"
          curl -fsS "https://hub.docker.com/v2/repositories/opensecurity/mobile-security-framework-mobsf/tags?page_size=25&ordering=last_updated" \
            | python3 -c 'import json,sys;[print(" ",t["name"],t["last_updated"][:10]) for t in json.load(sys.stdin)["results"] if t["name"].startswith("v4.")]'

      - name: Subir o MobSF
        run: |
          # Chave aleatória só desta execução; mascarada e nunca impressa.
          chave="$(openssl rand -hex 32)"
          echo "::add-mask::$chave"
          echo "MOBSF_API_KEY=$chave" >> "$GITHUB_ENV"
          docker run -d --name mobsf -p 127.0.0.1:8000:8000 \
            -e MOBSF_API_KEY="$chave" \
            "opensecurity/mobile-security-framework-mobsf:${MOBSF_TAG}"
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/scans || true)"
            # 401/403 = API de pé, só recusando sem chave; 200 = de pé.
            case "$code" in 200|401|403|405) echo "MobSF respondeu (http $code) após $((i*5))s"; exit 0;; esac
            sleep 5
          done
          docker logs --tail 80 mobsf | sed -E 's/[0-9a-f]{40,}/<oculto>/g'
          echo "::error::MobSF não respondeu em 5 min"
          exit 1

      - name: Enviar o APK e gerar o relatório
        run: |
          mkdir -p "$RUNNER_TEMP/mobsf"
          apk="$(ls "$RUNNER_TEMP"/apk/dist/*.apk "$RUNNER_TEMP"/apk/*.apk 2>/dev/null | head -1)"
          test -n "$apk" || { echo "::error::APK não encontrado no artifact"; find "$RUNNER_TEMP/apk" -type f; exit 1; }
          api=http://127.0.0.1:8000/api/v1
          up="$(curl -fsS -H "Authorization: $MOBSF_API_KEY" -F "file=@$apk" "$api/upload")"
          hash="$(printf '%s' "$up" | python3 -c 'import json,sys;print(json.load(sys.stdin)["hash"])')"
          file_name="$(printf '%s' "$up" | python3 -c 'import json,sys;print(json.load(sys.stdin)["file_name"])')"
          echo "Upload ok (hash $hash)"
          curl -fsS --max-time 1500 -H "Authorization: $MOBSF_API_KEY" \
            --data-urlencode "hash=$hash" --data-urlencode "scan_type=apk" --data-urlencode "file_name=$file_name" \
            "$api/scan" -o "$RUNNER_TEMP/mobsf/scan.json"
          curl -fsS -H "Authorization: $MOBSF_API_KEY" --data-urlencode "hash=$hash" \
            "$api/report_json" -o "$RUNNER_TEMP/mobsf/report.json"
          curl -fsS -H "Authorization: $MOBSF_API_KEY" --data-urlencode "hash=$hash" \
            "$api/download_pdf" -o "$RUNNER_TEMP/mobsf/report.pdf" || echo "::warning::PDF não gerado"
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print("Chaves do relatório:",sorted(d)[:60])' "$RUNNER_TEMP/mobsf/report.json"

      - name: Classificar achados (portão MobSF)
        run: python3 apps/app/scripts/seguranca/mobsf_gate.py "$RUNNER_TEMP/mobsf/report.json" apps/app/security/mobsf_aceitos.json

      - name: Testar o portão MobSF
        run: python3 -m unittest discover -s apps/app/scripts/seguranca -p 'test_*.py'

      - name: Guardar relatório do MobSF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heisuca-mobsf
          path: |
            ${{ runner.temp }}/mobsf/report.json
            ${{ runner.temp }}/mobsf/report.pdf
          if-no-files-found: ignore
          retention-days: 14

      - name: Parar o MobSF
        if: always()
        run: docker rm -f mobsf || true
