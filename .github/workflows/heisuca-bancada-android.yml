name: Heisuca Bancada Android

on:
  push:
    branches: ["codex/heisuca-home-site", "claude/heisuca-**"]
    paths-ignore: ["docs/**", "AGENTS.md", "apps/app/CLAUDE.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heisuca-bancada-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bancada:
    name: Percurso real no emulador (independente do APK)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Preparar KVM e espaço
        id: ambiente
        timeout-minutes: 10
        run: |
          runner_cores=$(nproc)
          avd_cores=$runner_cores
          if [ "$avd_cores" -gt 4 ]; then avd_cores=4; fi
          echo "CPUs disponíveis: $runner_cores; CPUs do AVD: $avd_cores"
          echo "cores=$avd_cores" >> "$GITHUB_OUTPUT"
          # O runner padrão chega com ~14 GB livres; APK de depuração + Gradle + imagem do emulador não cabem
          # (run 40228852177: "No space left on device" ao instalar a imagem). Só sai o que esta bancada não usa.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/go /opt/microsoft /opt/google
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if ! command -v ffprobe >/dev/null; then
            # 40344379555: índices 6 MB/s, pacotes do mirror Azure ~60 KB/s e retry.
            # Usa o arquivo oficial do Ubuntu, mantendo repositórios/chaves/assinaturas.
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          mkdir -p .bancada/evidencias
      - name: Dependências
        run: flutter pub get --no-example
      - name: Compilar APK da bancada antes de iniciar o emulador
        id: bancada_build
        env:
          ORG_GRADLE_PROJECT_targetAbi: x86_64
          ORG_GRADLE_PROJECT_heisucaPreview: "true"
          GRADLE_OPTS: -Dorg.gradle.caching=false -Dorg.gradle.jvmargs=-Xmx3g
        run: flutter build apk --debug --target integration_test/bancada_android_test.dart --target-platform android-x64
      - name: Liberar espaço da compilação antes do emulador
        run: |
          # O percurso instala o APK pronto (executar.py: adb install e flutter drive --use-application-binary).
          # Espaço é ganho extra (o runner já fica com ~32 GB livres): nunca derruba a bancada.
          (cd android && ./gradlew --stop >/dev/null 2>&1) || true
          pkill -f '[G]radleDaemon|[K]otlinCompileDaemon' || true
          sleep 2
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/wrapper/dists" build/app/intermediates build/app/tmp \
            build/app/kotlin build/app/generated || echo "Aviso: parte do cache do Gradle não saiu"
          df -h /
      - name: Compilar leitor rápido das janelas PiP (só bancada)
        run: python3 scripts/bancada/compilar_ui.py
      - name: Emulador e percurso autenticado
        id: percurso
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          HEISUCA_TESTE_SERVIDOR: ${{ secrets.HEISUCA_TESTE_SERVIDOR }}
          HEISUCA_TESTE_CONTAS: ${{ secrets.HEISUCA_TESTE_CONTAS }}
        with:
          api-level: 35
          # Retoma a imagem da K para comparar foco/Activity sem misturar com a troca para AOSP.
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: ${{ steps.ambiente.outputs.cores }}
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          # AOSP trace 40303114336: raster preso em glGetActiveUniform/qemu_pipe_read.
          # swiftshader_indirect foi descontinuado no Emulator 36.4.9; usa o backend
          # de software suportado escolhido pelo Emulator, sem trocar o motor do app.
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none
          working-directory: apps/app
          script: |
            adb root
            timeout 45 adb wait-for-device
            adb shell id
            # 40312145102: pressão CPU 91%, main pronta esperando CPU por 169 s.
            # Pixel 6 mantém ~411 x 914 dp: metade dos pixels por eixo e da densidade.
            # Só o AVD muda; nenhuma redução de efeitos ou prazo no aplicativo.
            adb shell wm size 540x1200
            adb shell wm density 210
            adb shell wm size
            adb shell wm density
            python3 scripts/bancada/executar.py
      - name: Classificar sem confundir infraestrutura com aprovação
        if: always()
        env:
          RESULTADO_ETAPA: ${{ steps.percurso.outcome }}
          RESULTADO_BUILD: ${{ steps.bancada_build.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('.bancada/evidencias/relatorio.json')
          if not path.exists():
              path.parent.mkdir(parents=True, exist_ok=True)
              status = 'falhou' if os.environ['RESULTADO_BUILD'] == 'failure' else 'instável'
              path.write_text(json.dumps({'status': status, 'motivo': 'A compilação falhou ou o emulador não chegou a executar o percurso.'}, ensure_ascii=False))
          report = json.loads(path.read_text())
          report['estado'] = ({'aprovado': 'verde', 'atenção': 'ATENÇÃO'}.get(report['status'], 'vermelho')
                              if os.environ['RESULTADO_ETAPA'] == 'success' else 'vermelho')
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2))
          if report['estado'] == 'ATENÇÃO': print('::warning::' + report['motivo'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Bancada Android: ' + report['estado'] + '\n\n')
              if report.get('motivo'): summary.write(report['motivo'] + '\n\n')
              summary.write('Este workflow é separado do APK. Falha de infraestrutura é instabilidade, nunca teste verde.\n')
              summary.write('Sem contas -kids; somente item sem histórico, com restauração conferida.\n')
          if report['estado'] == 'vermelho':
              raise SystemExit(1)
          PY
      - name: Guardar capturas, vídeos e relatório sem credenciais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heisuca-bancada-android
          path: apps/app/.bancada/evidencias/
          if-no-files-found: error
          retention-days: 7
