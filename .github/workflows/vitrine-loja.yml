name: Heisuca Vitrine da Loja

# Capturas para a ficha da Google Play, com o servidor PÚBLICO de demonstração do Jellyfin (sem segredos).
# Manual, ou por push no ramo vitrine/loja (o workflow_dispatch só aparece com o arquivo no main). Passos de cache/setup copiados da Bancada Android (heisuca-bancada-android.yml), que fica intacta.
on:
  push:
    branches: ["vitrine/loja"]
  workflow_dispatch:
    inputs:
      tamanho:
        description: "Resolução do AVD (largura x altura em pixels)"
        default: "1080x2400"
      densidade:
        description: "Densidade do AVD (dpi)"
        default: "420"

permissions:
  contents: read

concurrency:
  group: heisuca-vitrine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitrine:
    name: Capturas da loja no emulador
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Conferir se o ramo tem a ponta da V2
        working-directory: .
        run: scripts/heisuca-ramo-em-dia.sh "${{ github.ref_name }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Preparar KVM e espaço
        id: ambiente
        timeout-minutes: 10
        run: |
          runner_cores=$(nproc)
          avd_cores=$runner_cores
          if [ "$avd_cores" -gt 4 ]; then avd_cores=4; fi
          echo "cores=$avd_cores" >> "$GITHUB_OUTPUT"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/go /opt/microsoft /opt/google
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p .vitrine/capturas
      - name: Dependências
        run: flutter pub get --no-example
      - name: Compilar APK da vitrine antes de iniciar o emulador
        env:
          ORG_GRADLE_PROJECT_targetAbi: x86_64
          ORG_GRADLE_PROJECT_heisucaPreview: "true"
          GRADLE_OPTS: -Dorg.gradle.caching=false -Dorg.gradle.jvmargs=-Xmx3g
        run: |
          flutter build apk --debug --flavor direct --target integration_test/vitrine_loja_test.dart --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-direct-debug.apk build/app/outputs/flutter-apk/app-debug.apk
      - name: Liberar espaço da compilação antes do emulador
        run: |
          (cd android && ./gradlew --stop >/dev/null 2>&1) || true
          pkill -f '[G]radleDaemon|[K]otlinCompileDaemon' || true
          sleep 2
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/wrapper/dists" build/app/intermediates build/app/tmp \
            build/app/kotlin build/app/generated || echo "Aviso: parte do cache do Gradle não saiu"
          df -h /
      - name: Emulador e capturas
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          VITRINE_TAMANHO: ${{ inputs.tamanho || '1080x2400' }}
          VITRINE_DENSIDADE: ${{ inputs.densidade || '420' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # Pixel 6: 1080x2400, 420 dpi (o padrão da vitrine; a Bancada reduz pela metade, aqui não).
          profile: pixel_6
          cores: ${{ steps.ambiente.outputs.cores }}
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none
          working-directory: apps/app
          script: |
            for tentativa in 1 2 3 4 5; do timeout 30 adb wait-for-device || true; if adb root; then timeout 30 adb wait-for-device || true; break; fi; echo "Tentativa $tentativa/5 de adb root falhou"; sleep 3; done
            timeout 45 adb wait-for-device
            adb shell wm size "$VITRINE_TAMANHO"
            adb shell wm density "$VITRINE_DENSIDADE"
            adb shell wm size
            adb shell wm density
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put system accelerometer_rotation 0
            python3 scripts/vitrine_loja.py
      - name: Resumo
        if: always()
        run: |
          {
            echo "### Vitrine da loja"
            echo
            ls -1 .vitrine/capturas 2>/dev/null | sed 's/^/- /' || echo "Sem capturas."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitrine-loja
          path: |
            apps/app/.vitrine/capturas/
            apps/app/.vitrine/execucao.log
          if-no-files-found: error
          retention-days: 14
