name: Heisuca Desktop Windows Build

on:
  push:
    branches: ["gemini/heisuca-desktop-windows"]
    paths:
      - ".github/workflows/heisuca-desktop-windows.yml"
      - "apps/app/windows/**"
      - "apps/app/mpv-build.lock.json"
      - "apps/app/lib/main_desktop.dart"
      - "apps/app/lib/desktop/**"
      - "apps/app/test/desktop/**"
      - "apps/app/integration_test/desktop_native_playback_test.dart"
      - "apps/app/tool/desktop/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.1"

concurrency:
  group: heisuca-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Compilar Heisuca Windows (x64 Release)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Conferir contrato do instalador CGFLIX e Heisuca
        run: .\tool\desktop\test-installer-contract.ps1

      - name: Cache de dependencias nativas Windows (CMake _deps)
        uses: actions/cache@v4
        with:
          path: apps/app/build/windows/x64/direct/_deps
          key: heisuca-win-native-x64-${{ hashFiles('apps/app/windows/CMakeLists.txt', 'apps/app/mpv-build.lock.json') }}

      - name: Setup Flutter (3.47.1 pinned)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Obter dependencias Flutter
        run: flutter pub get --no-example

      - name: Analise estatica dos alvos desktop
        run: flutter analyze --no-pub lib/main_desktop.dart lib/desktop test/desktop integration_test/desktop_native_playback_test.dart

      - name: Testes unitarios e widgets desktop
        run: flutter test --no-pub test/desktop test/design test/services/plex_auth_service_test.dart test/services/playback_progress_tracker_test.dart test/services/jellyfin_auth_header_test.dart

      - name: Preparar cache Windows e instalar engine DComp (SHA/stamp validados)
        run: |
          flutter precache --windows
          .\windows\tool\install-patched-engine.ps1

      - name: Compilar Windows Release (entrypoint desktop)
        run: flutter build windows --release -t lib/main_desktop.dart --dart-define=HEISUCA_DESKTOP_REVISION=${{ github.sha }} --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Verificar bundle Windows (heisuca.exe, libmpv, vulkan, runtime, licencas)
        run: |
          $bundleDir = "build/windows/x64/direct/runner/Release"
          if (-not (Test-Path -LiteralPath $bundleDir -PathType Container)) {
            throw "Diretorio de bundle Windows nao existe: $bundleDir"
          }

          $bundlePath = (Resolve-Path -LiteralPath $bundleDir).Path
          $foundFiles = @(
            Get-ChildItem -LiteralPath $bundlePath -File -Recurse |
              ForEach-Object {
                $_.FullName.Substring($bundlePath.Length + 1).Replace('\', '/')
              } |
              Sort-Object
          )

          Write-Host "Arquivos encontrados em ${bundleDir}:"
          $foundFiles | ForEach-Object { Write-Host "  $_" }

          $requiredFiles = @(
            "heisuca.exe"
            "flutter_windows.dll"
            "libmpv-2.dll"
            "vulkan-1.dll"
            "VulkanRT-License.txt"
            "msvcp140.dll"
            "vcruntime140.dll"
            "data/app.so"
            "data/icudtl.dat"
          )
          $forbiddenFiles = @(
            "heisuca.lib"
            "heisuca.exp"
            "simdutf.lib"
          )

          $errors = @()
          foreach ($file in $requiredFiles) {
            if ($foundFiles -notcontains $file) {
              Write-Output "::error::Arquivo obrigatorio ausente no bundle: $file"
              $errors += "missing:$file"
            }
          }
          foreach ($file in $forbiddenFiles) {
            if ($foundFiles -contains $file) {
              Write-Output "::error::Artefato de linkagem proibido no bundle: $file"
              $errors += "forbidden:$file"
            }
          }
          foreach ($file in @($foundFiles | Where-Object { $_ -like '*.pdb' })) {
            Write-Output "::error::Arquivo de debug proibido no bundle: $file"
            $errors += "pdb:$file"
          }

          if ($errors.Count -gt 0) {
            throw "Falha na verificacao do bundle Windows: $($errors -join ', ')"
          }

      - name: Copiar licenca GPL e atribuicoes para o bundle
        run: |
          $bundleDir = "build/windows/x64/direct/runner/Release"
          $licensesDir = Join-Path $bundleDir "licenses"
          New-Item -ItemType Directory -Path $licensesDir -Force | Out-Null

          $repoRoot = (Resolve-Path -LiteralPath "../..").Path
          $appRoot = (Get-Location).Path
          $searchDirs = @($repoRoot, $appRoot)
          $licensePatterns = @("LICENSE*", "COPYING*", "NOTICE*", "THIRD_PARTY*", "ATTRIBUTION*")

          $copiedGpl = $false
          foreach ($dir in $searchDirs) {
            foreach ($pattern in $licensePatterns) {
              Get-ChildItem -LiteralPath $dir -Filter $pattern -File -ErrorAction SilentlyContinue | ForEach-Object {
                Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $licensesDir $_.Name) -Force
                if ($_.Name -match '^(LICENSE|COPYING)') {
                  Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $bundleDir $_.Name) -Force
                  $copiedGpl = $true
                }
              }
            }
          }

          if (-not $copiedGpl) {
            throw "Nenhum arquivo LICENSE ou COPYING encontrado na raiz do repositorio ou em apps/app."
          }

          $vulkanLicense = Join-Path $bundleDir "VulkanRT-License.txt"
          if (Test-Path -LiteralPath $vulkanLicense -PathType Leaf) {
            Copy-Item -LiteralPath $vulkanLicense -Destination (Join-Path $licensesDir "VulkanRT-License.txt") -Force
          }

          $noticePath = Join-Path $licensesDir "ATRIBUICOES_HEISUCA.txt"
          @(
            "Heisuca Desktop (Windows) - Atribuicoes e Licencas"
            "=================================================="
            ""
            "- Heisuca e derivado do projeto Plezy (https://github.com/edde746/plezy), licenciado sob GNU GPL v3.0."
            "- Usa a engine Flutter com DirectComposition de flutter-plezy (https://github.com/edde746/flutter-plezy)."
            "- Inclui libmpv-2.dll (https://github.com/edde746/mpv-build) e Vulkan Runtime Loader (VulkanRT-License.txt)."
            "- Inclui runtime MSVC empacotado localmente via CMake InstallRequiredSystemLibraries."
          ) | Set-Content -LiteralPath $noticePath -Encoding UTF8

      - name: Reproduzir fixture no backend Windows real (sem GPU ou audio fisicos)
        timeout-minutes: 12
        run: flutter test --no-pub integration_test/desktop_native_playback_test.dart -d windows

      - name: Capturar janela Windows com video em movimento (sem audio fisico)
        timeout-minutes: 3
        run: .\tool\desktop\capture-native-windows.ps1

      - name: Gerar instalador Inno e ZIP sem instalacao
        run: |
          $bundle = (Resolve-Path 'build/windows/x64/direct/runner/Release').Path
          $version = ((Get-Content pubspec.yaml | Select-String '^version:').Line -replace '^version:\s*', '').Split('+')[0].Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw 'Invalid Windows version' }
          .\windows\build-installer.ps1 -Product Heisuca -Version $version -X64BuildDir $bundle -OutputDir 'dist'
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          foreach ($name in @('heisuca-windows-x64-portable.zip', 'heisuca-windows-installer.exe')) {
            $path = Join-Path 'dist' $name
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing package: $name" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -LiteralPath "$path.sha256" -Encoding ASCII
          }

      - name: Testar instalar, atualizar, reproduzir e desinstalar
        timeout-minutes: 5
        run: .\tool\desktop\test-windows-package.ps1

      - name: Capturar inicio nativo nos tres temas Heisuca
        timeout-minutes: 3
        run: |
          foreach ($theme in @('shikkoku', 'hisui', 'sumi')) {
            & pwsh -NoProfile -File '.\tool\desktop\capture-native-windows.ps1' -HomeOnly -Theme $theme -Output "dist/home-evidence/$theme"
            if ($LASTEXITCODE -ne 0) { throw "Home capture failed: $theme" }
          }

      - name: Publicar ZIP sem instalacao (sem release/publicacao)
        uses: actions/upload-artifact@v4
        with:
          name: heisuca-desktop-windows-x64
          path: |
            apps/app/dist/heisuca-windows-x64-portable.zip
            apps/app/dist/heisuca-windows-x64-portable.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publicar instalador Inno (sem release/publicacao)
        uses: actions/upload-artifact@v4
        with:
          name: heisuca-windows-installer
          path: |
            apps/app/dist/heisuca-windows-installer.exe
            apps/app/dist/heisuca-windows-installer.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Guardar capturas e evidencia mesmo em falha visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heisuca-windows-native-evidence
          path: |
            apps/app/dist/native-evidence/
            apps/app/dist/install-evidence/
            apps/app/dist/home-evidence/
          if-no-files-found: warn
          retention-days: 14
