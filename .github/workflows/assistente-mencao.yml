# Responde quando alguém COM acesso de escrita ao repositório escreve @claude numa issue, num PR ou numa revisão.
# Pessoas de fora não acionam este fluxo (regra padrão da ação). Aqui o assistente lê o código para responder e
# revisar, mas não tem permissão de gravar no repositório: quem altera código e faz merge é gente.
#
# Para ligar: instalar o app do Claude no repositório e criar o segredo CLAUDE_CODE_OAUTH_TOKEN
# (os dois passos saem de `/install-github-app`, dentro do Claude Code).
name: Assistente — menção a @claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  responder:
    if: >-
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Conferir se o assistente está ligado
        id: ligado
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "sim=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Assistente desligado: falta o segredo CLAUDE_CODE_OAUTH_TOKEN."
          fi

      - uses: actions/checkout@v4
        if: steps.ligado.outputs.sim == '1'
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        if: steps.ligado.outputs.sim == '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 20
            --append-system-prompt "Responda sempre em português do Brasil, de forma direta. Você revisa e explica; não altere arquivos, não faça commit nem push. Regras do projeto: AGENTS.md e apps/app/CLAUDE.md."
