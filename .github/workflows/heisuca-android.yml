name: Heisuca Android Build

on:
  push:
    branches: ["gemini/**", "claude/**", "codex/heisuca-**"]
    paths-ignore: ["docs/**", "AGENTS.md", "apps/app/CLAUDE.md"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.1"

concurrency:
  group: heisuca-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar APK Heisuca (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Liberar espaco em disco na VM
        working-directory: /
        run: |
          echo "Espaco antes da limpeza:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "Espaco apos a limpeza:"
          df -h /

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: heisuca-clean-${{ runner.os }}-gradle-${{ hashFiles('apps/app/**/*.gradle*', 'apps/app/**/gradle-wrapper.properties') }}

      - name: Obter dependências Flutter
        run: flutter pub get --no-example

      - name: Preparar leitura dos pixels nativos no portão
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi

      - name: Validar análise e testes antes do APK
        run: bash scripts/heisuca-checar.sh

      - name: Configurar Assinatura
        env:
          KEYSTORE_B64: ${{ secrets.HEISUCA_PLAY_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.HEISUCA_PLAY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.HEISUCA_PLAY_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HEISUCA_PLAY_KEY_ALIAS }}
        run: |
          # Sem a chave do Heisuca o APK não é gerado: nunca cair para a chave de debug.
          missing=()
          [ -n "$KEYSTORE_B64" ] || missing+=(HEISUCA_PLAY_KEYSTORE_B64)
          [ -n "$STORE_PASSWORD" ] || missing+=(HEISUCA_PLAY_STORE_PASSWORD)
          [ -n "$KEY_PASSWORD" ] || missing+=(HEISUCA_PLAY_KEY_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(HEISUCA_PLAY_KEY_ALIAS)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Faltam secrets de assinatura: ${missing[*]}"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.p12
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.p12"
          } > android/key.properties
          echo "Assinando com a chave do Heisuca."

      - name: Conferir isolamento dos providers no manifesto
        run: python3 scripts/heisuca-validar-apk.py --source-only

      - name: Testar limites nativos do buffer mpv
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest --tests app.heisuca.mpv.HeisucaBufferBudgetTest --tests app.heisuca.HeisucaPipParamsTest --tests app.heisuca.HeisucaDownloadNotificationTest --tests app.heisuca.mpv.MpvPlayerBackgroundAudioTest -PtargetAbi=arm64-v8a -PheisucaPreview=true

      - name: Compilar APK Release (arm64-v8a)
        run: |
          preview_args=()
          if [[ "$GITHUB_REF_NAME" == codex/heisuca-* || "$GITHUB_REF_NAME" == claude/heisuca-* ]]; then
            preview_args+=(-PheisucaPreview=true)
          fi
          flutter build apk --release --target-platform android-arm64 --split-per-abi -PtargetAbi=arm64-v8a "${preview_args[@]}" --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Conferir pacote, providers e assinatura do APK
        run: python3 scripts/heisuca-validar-apk.py build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Organizar e Renomear APKs
        run: |
          mkdir -p dist
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "dist/heisuca-arm64-v8a.apk"
          elif [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-release.apk" "dist/heisuca-arm64-v8a.apk"
          else
            cp build/app/outputs/flutter-apk/*.apk dist/heisuca-arm64-v8a.apk
          fi
          ls -lh dist

      - name: Guardar APK para diagnóstico se uma conferência falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: heisuca-diagnostico-nao-aprovado
          path: apps/app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore
          retention-days: 3

      - name: Publicar Artifact Heisuca APK
        uses: actions/upload-artifact@v4
        with:
          name: heisuca-apk
          path: |
            apps/app/dist/*.apk
            apps/app/assets/heisuca/CHANGELOG_USUARIO.md
          retention-days: 14

